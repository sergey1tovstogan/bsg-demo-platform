version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: bsg-db
    environment:
      POSTGRES_DB: bsg_demo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bsg-network

  # Redis Cache (Optional)
  redis:
    image: redis:7-alpine
    container_name: bsg-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bsg-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bsg-backend
    environment:
      # Application
      ENVIRONMENT: development
      DEBUG: "True"

      # Database
      DATABASE_URL: postgresql://postgres:postgres@db:5432/bsg_demo

      # JWT
      JWT_SECRET_KEY: dev-secret-key-change-in-production

      # Redis (Optional)
      REDIS_URL: redis://redis:6379/0
      CACHE_ENABLED: "True"

      # CORS
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173

      # Logging
      LOG_LEVEL: DEBUG
      LOG_FORMAT: json

      # Rate Limiting
      RATE_LIMIT_ENABLED: "True"
      RATE_LIMIT_PER_MINUTE: 60
      RATE_LIMIT_PER_HOUR: 1000

      # Video Storage
      VIDEO_STORAGE_PATH: /app/uploads/videos
      VIDEO_MAX_SIZE_MB: 500
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - video_uploads:/app/uploads/videos
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bsg-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
    name: bsg-postgres-data
  video_uploads:
    name: bsg-video-uploads

networks:
  bsg-network:
    name: bsg-network
    driver: bridge
