services:
  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bsg-backend
    environment:
      # Application
      ENVIRONMENT: development
      DEBUG: "True"

      # Database (MongoDB - Azure Cosmos DB)
      DATABASE_URL: ${DATABASE_URL:-mongodb://localhost:27017/bsg_demo}
      DATABASE_NAME: bsg_demo

      # JWT
      JWT_SECRET_KEY: dev-secret-key-change-in-production

      # Caching (Disabled - using in-memory fallback)
      CACHE_ENABLED: "False"

      # CORS

      # Logging
      LOG_LEVEL: DEBUG
      LOG_FORMAT: json

      # Rate Limiting
      RATE_LIMIT_ENABLED: "True"
      RATE_LIMIT_PER_MINUTE: 60
      RATE_LIMIT_PER_HOUR: 1000

      # Video Storage
      VIDEO_STORAGE_PATH: /app/uploads/videos
      VIDEO_MAX_SIZE_MB: 500
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - video_uploads:/app/uploads/videos
    networks:
      - bsg-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-exclude "*.pyc" --reload-exclude "__pycache__"

volumes:
  video_uploads:
    name: bsg-video-uploads

networks:
  bsg-network:
    name: bsg-network
    driver: bridge
