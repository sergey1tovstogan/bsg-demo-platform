name: Deploy to Azure App Service

on:
  push:
    branches:
      - develop
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: bsg-demo-platform-app
  AZURE_RESOURCE_GROUP: bsg-demo-platform
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      
      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Test backend imports
        working-directory: ./backend
        run: |
          echo "Testing critical imports..."
          python -c "from app.main import app; print('✓ FastAPI app imports successfully')"
          python -c "from app.core.config import settings; print('✓ Settings import successfully')"
          echo "✓ All critical imports successful"
      
      - name: Validate backend structure
        working-directory: ./backend
        run: |
          echo "Validating backend structure..."
          [ -f "app/main.py" ] || (echo "✗ app/main.py not found" && exit 1)
          [ -f "requirements.txt" ] || (echo "✗ requirements.txt not found" && exit 1)
          [ -d "app/api" ] || (echo "✗ app/api directory not found" && exit 1)
          echo "✓ Backend structure is valid"

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: |
          npm ci
          # Ensure @types/react-dom is properly installed
          npm list @types/react-dom || npm install --save-dev @types/react-dom@^18.2.43
      
      - name: Type check frontend
        working-directory: ./frontend
        run: |
          echo "Running TypeScript type check..."
          npx tsc --noEmit || (echo "⚠ TypeScript errors found" && exit 1)
          echo "✓ TypeScript type check passed"
      
      - name: Test frontend build
        working-directory: ./frontend
        run: |
          echo "Testing frontend build..."
          npm run build
          echo "✓ Frontend build successful"
      
      - name: Validate frontend build output
        working-directory: ./frontend
        run: |
          echo "Validating build output..."
          [ -d "dist" ] || (echo "✗ dist directory not found" && exit 1)
          [ -f "dist/index.html" ] || (echo "✗ dist/index.html not found" && exit 1)
          echo "✓ Frontend build output is valid"

  build-and-deploy:
    name: Build and Deploy (Optimized)
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    timeout-minutes: 25
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js and Python (parallel)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      
      - name: Azure Login (early - for parallel operations)
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
        continue-on-error: false
        id: azure-login
      
      - name: Install dependencies and build frontend (consolidated)
        run: |
          echo "Installing dependencies and building in parallel..."
          (
            cd frontend && npm ci && npm list @types/react-dom || npm install --save-dev @types/react-dom@^18.2.43 && npm run build
          ) &
          FRONTEND_PID=$!
          (
            cd backend && python -m pip install --upgrade pip && pip install -r requirements.txt
          ) &
          BACKEND_PID=$!
          wait $FRONTEND_PID
          wait $BACKEND_PID
          echo "✓ Dependencies installed and frontend built"
        env:
          VITE_API_URL: /api/v1
          NODE_ENV: production
      
      - name: Prepare backend package (consolidated - copy, cleanup, verify, package)
        run: |
          echo "Preparing backend package (consolidated steps)..."
          
          # Copy frontend build to backend static
          mkdir -p backend/app/static
          if [ -d "frontend/dist" ] && [ "$(ls -A frontend/dist)" ]; then
            if command -v rsync &> /dev/null; then
              rsync -a --delete frontend/dist/ backend/app/static/
            else
              cp -r frontend/dist/* backend/app/static/
            fi
            [ -f "backend/app/static/index.html" ] || (echo "ERROR: index.html not found!" && exit 1)
            echo "✓ Frontend files copied"
          else
            echo "ERROR: frontend/dist directory is empty or doesn't exist!"
            exit 1
          fi
          
          # Make startup script executable
          chmod +x backend/startup.sh
          
          # Quick cleanup (only essential files)
          cd backend
          rm -rf scripts/ infrastructure/ uploads/ tests/ .pytest_cache/ .vscode/ .idea/ || true
          find . -maxdepth 1 -name "*.md" -delete 2>/dev/null || true
          find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find . -type f \( -name "*.pyc" -o -name "*.pyo" -o -name "*.log" \) -delete 2>/dev/null || true
          cd ..
          
          # Verify requirements.txt
          [ -f "backend/requirements.txt" ] || (echo "ERROR: requirements.txt not found!" && exit 1)
          
          # Create deployment package
          cd backend
          zip -q -r ../backend-deploy.zip . -x "*.git*" -x "*__pycache__*" -x "*.pyc" -x "*.pyo" 2>/dev/null || {
            tar -czf ../backend-deploy.tar.gz --exclude='.git' --exclude='__pycache__' --exclude='*.pyc' --exclude='*.pyo' . 2>/dev/null
            [ -f ../backend-deploy.tar.gz ] && mv ../backend-deploy.tar.gz ../backend-deploy.zip
          }
          cd ..
          [ -f backend-deploy.zip ] || (echo "ERROR: Failed to create package!" && exit 1)
          echo "✓ Package created: $(ls -lh backend-deploy.zip | awk '{print $5}')"
      
      - name: Check for ongoing deployments (non-blocking)
        run: |
          ONGOING=$(az webapp deployment list \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query "[?status=='InProgress'].id" -o tsv 2>/dev/null || echo "")
          if [ -n "$ONGOING" ]; then
            echo "⚠ Ongoing deployment detected, waiting 10 seconds..."
            sleep 10
          fi
        continue-on-error: true
        timeout-minutes: 1
      
      - name: Deploy to Azure Web App (with settings)
        id: deploy-backend
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ./backend-deploy.zip
          startup-command: "bash startup.sh"
        timeout-minutes: 20
        continue-on-error: false
      
      - name: Configure App Settings (minimal wait)
        run: |
          echo "Configuring app settings (minimal wait: 5s)..."
          sleep 5
          
          # Generate JWT secret if not provided
          TEMP_JWT_SECRET="${{ secrets.JWT_SECRET_KEY }}"
          [ -z "$TEMP_JWT_SECRET" ] && TEMP_JWT_SECRET=$(python3 -c "import secrets; print(secrets.token_urlsafe(32))")
          
          # Set RAG_API_URL
          RAG_API_URL_VALUE="${{ secrets.RAG_API_URL }}"
          [ -z "$RAG_API_URL_VALUE" ] && RAG_API_URL_VALUE="https://tbsg.temenos.com"
          
          # Build settings string
          SETTINGS_STRING="SCM_DO_BUILD_DURING_DEPLOYMENT=true ENABLE_ORYX_BUILD=true ENVIRONMENT=production DEBUG=False DATABASE_NAME=bsg_demo CORS_ORIGINS=* JWT_SECRET_KEY=$TEMP_JWT_SECRET RAG_API_URL=$RAG_API_URL_VALUE"
          [ -n "${{ secrets.DATABASE_URL }}" ] && SETTINGS_STRING="$SETTINGS_STRING DATABASE_URL=${{ secrets.DATABASE_URL }}"
          [ -n "${{ secrets.RAG_JWT_TOKEN }}" ] && SETTINGS_STRING="$SETTINGS_STRING RAG_JWT_TOKEN=${{ secrets.RAG_JWT_TOKEN }}"
          
          # Configure in parallel
          az webapp config appsettings set \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --settings $SETTINGS_STRING \
            --output none &
          az webapp config set \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --startup-file "startup.sh" \
            --always-on true \
            --output none &
          wait
          echo "✓ Settings configured"
        timeout-minutes: 2
      
      - name: Verify deployment completed
        if: steps.deploy-backend.outcome != 'success'
        run: |
          echo "⚠ Deployment step did not complete successfully"
          echo "This may indicate a timeout or deployment failure"
          echo "Check Azure Portal for deployment status"
          exit 1
      
      # NOTE: App settings are configured via the deployment action's app-settings parameter
      # This avoids SCM container restart conflicts by letting Azure handle it during deployment
      
      - name: Quick Health Check (non-blocking)
        continue-on-error: true
        timeout-minutes: 1
        run: |
          WEBAPP_URL="https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 $WEBAPP_URL/api/v1/live 2>/dev/null || echo "000")
          [ "$HTTP_CODE" = "200" ] && echo "✓ App responding" || echo "⚠ App starting (check: $WEBAPP_URL/api/v1/live)"
      
      - name: Deployment Summary
        run: |
          WEBAPP_URL="https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"
          echo "## Deployment Complete 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Frontend URL**: $WEBAPP_URL" >> $GITHUB_STEP_SUMMARY
          echo "**Backend API**: $WEBAPP_URL/api/v1" >> $GITHUB_STEP_SUMMARY
          echo "**API Docs**: $WEBAPP_URL/docs" >> $GITHUB_STEP_SUMMARY
          echo "**Health Check**: $WEBAPP_URL/api/v1/health" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🌐 Live Application" >> $GITHUB_STEP_SUMMARY
          echo "Your application is now live at: **$WEBAPP_URL**" >> $GITHUB_STEP_SUMMARY