name: Deploy to Azure App Service

on:
  push:
    branches:
      - develop
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: bsg-demo-platform-app
  AZURE_RESOURCE_GROUP: bsg-demo-platform
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci
      
      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
        env:
          VITE_API_URL: /api/v1
          NODE_ENV: production
      
      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
        continue-on-error: false
        id: azure-login
      
      - name: Install kubectl (for AKS namespace discovery)
        run: |
          # Install kubectl for AKS namespace discovery
          # This is optional - the app will work without it, but namespace discovery won't work
          if ! command -v kubectl &> /dev/null; then
            echo "Installing kubectl..."
            curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
            chmod +x kubectl
            sudo mv kubectl /usr/local/bin/
            kubectl version --client
          else
            echo "kubectl already installed"
            kubectl version --client
          fi
        continue-on-error: true
        id: install-kubectl
      
      - name: Copy frontend build to backend static
        run: |
          mkdir -p backend/app/static
          cp -r frontend/dist/* backend/app/static/
      
      - name: Clean up unnecessary files
        working-directory: ./backend
        run: |
          # Remove test files
          find . -name "*test*.py" -not -path "./app/*" -delete || true
          # Remove files that shouldn't be deployed
          rm -rf scripts/ infrastructure/ uploads/ __pycache__/ .pytest_cache/ || true
          # Find and remove all __pycache__ directories (handle both Unix and Windows paths)
          find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find . -type d -name "*__pycache__*" -exec rm -rf {} + 2>/dev/null || true
          # Remove Python cache files
          find . -type f -name "*.pyc" -delete 2>/dev/null || true
          find . -type f -name "*.pyo" -delete 2>/dev/null || true
          find . -type f -name "*.log" -delete 2>/dev/null || true
          # Remove any Windows-style paths that might have been created
          find . -type f -path "*\\*" -delete 2>/dev/null || true
          find . -type d -path "*\\*" -exec rm -rf {} + 2>/dev/null || true
      
      - name: Create startup script
        run: |
          cat > backend/startup.sh << 'EOF'
          #!/bin/bash
          cd /home/site/wwwroot
          gunicorn app.main:app --bind 0.0.0.0:8000 --workers 4 --worker-class uvicorn.workers.UvicornWorker --timeout 120 --access-logfile - --error-logfile -
          EOF
          chmod +x backend/startup.sh
      
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ./backend
          startup-command: 'gunicorn app.main:app --bind 0.0.0.0:8000 --workers 2 --worker-class uvicorn.workers.UvicornWorker --timeout 120'
          python-version: '3.11'
      
      - name: Configure App Settings
        run: |
          echo "Configuring Azure App Service settings..."
          
          # Generate JWT secret if not provided
          if [ -z "${{ secrets.JWT_SECRET_KEY }}" ]; then
            echo "⚠ Warning: JWT_SECRET_KEY secret is not set. Generating a temporary one..."
            TEMP_JWT_SECRET=$(python3 -c "import secrets; print(secrets.token_urlsafe(32))")
          else
            TEMP_JWT_SECRET="${{ secrets.JWT_SECRET_KEY }}"
          fi
          
          # Set RAG_API_URL (use secret or default)
          RAG_API_URL_VALUE="${{ secrets.RAG_API_URL }}"
          if [ -z "$RAG_API_URL_VALUE" ]; then
            RAG_API_URL_VALUE="https://tbsg.temenos.com"
          fi
          
          # Build settings command - set each setting individually to avoid escaping issues
          echo "Setting basic app settings..."
          az webapp config appsettings set \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --settings \
              SCM_DO_BUILD_DURING_DEPLOYMENT=true \
              ENABLE_ORYX_BUILD=true \
              SCM_BUILD_ARGS="--build-arg REQUIREMENTS_FILE=requirements.txt" \
              ENVIRONMENT=production \
              DEBUG=False \
              DATABASE_NAME=bsg_demo \
              CORS_ORIGINS="*" \
              JWT_SECRET_KEY="$TEMP_JWT_SECRET" \
              RAG_API_URL="$RAG_API_URL_VALUE" \
            --output none
          
          # Set secrets individually if they exist (to avoid exposing them in logs)
          if [ -n "${{ secrets.DATABASE_URL }}" ]; then
            echo "Setting DATABASE_URL..."
            az webapp config appsettings set \
              --name ${{ env.AZURE_WEBAPP_NAME }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --settings DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              --output none
          else
            echo "⚠ Warning: DATABASE_URL secret is not set. App may not work correctly."
            echo "Please set DATABASE_URL in GitHub Secrets"
          fi
          
          if [ -n "${{ secrets.RAG_JWT_TOKEN }}" ]; then
            echo "Setting RAG_JWT_TOKEN..."
            az webapp config appsettings set \
              --name ${{ env.AZURE_WEBAPP_NAME }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --settings RAG_JWT_TOKEN="${{ secrets.RAG_JWT_TOKEN }}" \
              --output none
          else
            echo "⚠ Warning: RAG_JWT_TOKEN secret is not set. RAG features will not work."
          fi
          
          echo ""
          echo "✓ App settings configured successfully"
          echo ""
          echo "Required GitHub Secrets Status:"
          echo "  - DATABASE_URL: $([ -n "${{ secrets.DATABASE_URL }}" ] && echo "✓ Set" || echo "✗ Missing - REQUIRED")"
          echo "  - RAG_JWT_TOKEN: $([ -n "${{ secrets.RAG_JWT_TOKEN }}" ] && echo "✓ Set" || echo "✗ Missing (RAG features disabled)")"
          echo "  - RAG_API_URL: $([ -n "${{ secrets.RAG_API_URL }}" ] && echo "✓ Set" || echo "⚠ Using default: https://tbsg.temenos.com")"
          echo "  - JWT_SECRET_KEY: $([ -n "${{ secrets.JWT_SECRET_KEY }}" ] && echo "✓ Set" || echo "⚠ Generated temporary key")"
          echo ""
          echo "To set secrets: Repository → Settings → Secrets and variables → Actions → New repository secret"
          echo "See ENVIRONMENT_VARIABLES.md for details"
          
          # Set startup command
          az webapp config set \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --startup-file "gunicorn app.main:app --bind 0.0.0.0:8000 --workers 2 --worker-class uvicorn.workers.UvicornWorker --timeout 120" \
            --output none
          
          # Enable Always On (critical for App Service to prevent sleep)
          az webapp config set \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --always-on true \
            --output none
          
          # Note: kubectl is not available in Azure App Service by default
          # The app will handle this gracefully - namespace discovery will be skipped if kubectl is not available
          echo "App settings configured successfully"
          echo "Note: kubectl may not be available in Azure App Service. Namespace discovery will work if kubectl is installed, otherwise it will be skipped gracefully."
      
      - name: Health Check
        run: |
          WEBAPP_URL="https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"
          echo "Waiting for app to start..."
          sleep 60
          
          # First check liveness endpoint (doesn't require DB)
          echo "Checking liveness endpoint..."
          MAX_RETRIES=15
          RETRY_DELAY=10
          LIVENESS_PASSED=false
          
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Liveness check attempt $i/$MAX_RETRIES..."
            if curl -f -s --max-time 30 $WEBAPP_URL/api/v1/live > /dev/null 2>&1; then
              echo "✓ Liveness check passed!"
              LIVENESS_PASSED=true
              break
            else
              echo "Liveness check failed, retrying in $RETRY_DELAY seconds..."
              if [ $i -lt $MAX_RETRIES ]; then
                sleep $RETRY_DELAY
              fi
            fi
          done
          
          if [ "$LIVENESS_PASSED" = false ]; then
            echo "❌ Liveness check failed after $MAX_RETRIES attempts"
            echo "Checking app logs..."
            az webapp log tail --name ${{ env.AZURE_WEBAPP_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --timeout 10 || true
            exit 1
          fi
          
          # Now check full health endpoint
          echo "Checking full health endpoint..."
          if curl -f -s --max-time 30 $WEBAPP_URL/api/v1/health; then
            echo "✓ Full health check passed!"
          else
            echo "⚠ Full health check returned non-200, but app is alive"
            echo "This may indicate database connectivity issues, but app is running"
          fi
          
          echo "Deployment successful!"
      
      - name: Deployment Summary
        run: |
          WEBAPP_URL="https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"
          echo "## Deployment Complete 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Frontend URL**: $WEBAPP_URL" >> $GITHUB_STEP_SUMMARY
          echo "**Backend API**: $WEBAPP_URL/api/v1" >> $GITHUB_STEP_SUMMARY
          echo "**API Docs**: $WEBAPP_URL/docs" >> $GITHUB_STEP_SUMMARY
          echo "**Health Check**: $WEBAPP_URL/api/v1/health" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🌐 Live Application" >> $GITHUB_STEP_SUMMARY
          echo "Your application is now live at: **$WEBAPP_URL**" >> $GITHUB_STEP_SUMMARY

