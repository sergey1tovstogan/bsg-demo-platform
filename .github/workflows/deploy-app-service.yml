name: Deploy to Azure App Service

on:
  push:
    branches:
      - develop
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: bsg-demo-platform-app
  AZURE_RESOURCE_GROUP: bsg-demo-platform
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      
      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Test backend imports
        working-directory: ./backend
        run: |
          echo "Testing critical imports..."
          python -c "from app.main import app; print('✓ FastAPI app imports successfully')"
          python -c "from app.core.config import settings; print('✓ Settings import successfully')"
          echo "✓ All critical imports successful"
      
      - name: Validate backend structure
        working-directory: ./backend
        run: |
          echo "Validating backend structure..."
          [ -f "app/main.py" ] || (echo "✗ app/main.py not found" && exit 1)
          [ -f "requirements.txt" ] || (echo "✗ requirements.txt not found" && exit 1)
          [ -d "app/api" ] || (echo "✗ app/api directory not found" && exit 1)
          echo "✓ Backend structure is valid"

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci
      
      - name: Type check frontend
        working-directory: ./frontend
        run: |
          echo "Running TypeScript type check..."
          npx tsc --noEmit || (echo "⚠ TypeScript errors found" && exit 1)
          echo "✓ TypeScript type check passed"
      
      - name: Test frontend build
        working-directory: ./frontend
        run: |
          echo "Testing frontend build..."
          npm run build
          echo "✓ Frontend build successful"
      
      - name: Validate frontend build output
        working-directory: ./frontend
        run: |
          echo "Validating build output..."
          [ -d "dist" ] || (echo "✗ dist directory not found" && exit 1)
          [ -f "dist/index.html" ] || (echo "✗ dist/index.html not found" && exit 1)
          echo "✓ Frontend build output is valid"

  build-and-deploy:
    name: Build and Deploy (Fast)
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    timeout-minutes: 20
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci
      
      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
        env:
          VITE_API_URL: /api/v1
          NODE_ENV: production
      
      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
        continue-on-error: false
        id: azure-login
      
      - name: Install kubectl (for AKS namespace discovery)
        run: |
          # Install kubectl for AKS namespace discovery
          # This is optional - the app will work without it, but namespace discovery won't work
          if ! command -v kubectl &> /dev/null; then
            echo "Installing kubectl..."
            curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
            chmod +x kubectl
            sudo mv kubectl /usr/local/bin/
            kubectl version --client
          else
            echo "kubectl already installed"
            kubectl version --client
          fi
        continue-on-error: true
        id: install-kubectl
      
      - name: Copy frontend build to backend static (Fast)
        run: |
          echo "Copying frontend build to backend static directory..."
          mkdir -p backend/app/static
          if [ -d "frontend/dist" ] && [ "$(ls -A frontend/dist)" ]; then
            # Use rsync if available for faster copy, otherwise cp
            if command -v rsync &> /dev/null; then
              rsync -a --delete frontend/dist/ backend/app/static/
            else
              cp -r frontend/dist/* backend/app/static/
            fi
            # Quick verification only
            [ -f "backend/app/static/index.html" ] || (echo "ERROR: index.html not found!" && exit 1)
            echo "✓ Frontend files copied successfully"
          else
            echo "ERROR: frontend/dist directory is empty or doesn't exist!"
            exit 1
          fi
      
      - name: Make startup script executable
        run: |
          echo "Making startup.sh executable..."
          chmod +x backend/startup.sh
          echo "✓ startup.sh is now executable"
      
      - name: Clean up unnecessary files (optimized)
        working-directory: ./backend
        run: |
          echo "Cleaning up unnecessary files to reduce package size..."
          echo "Package size before cleanup:"
          du -sh . 2>/dev/null | cut -f1 || echo "N/A"
          
          # Aggressive cleanup - remove everything not needed for runtime
          # Note: .deploymentignore handles most exclusions, but we do additional cleanup here
          
          # Remove development/test files
          rm -rf scripts/ infrastructure/ uploads/ tests/ .pytest_cache/ .vscode/ .idea/ || true
          
          # Remove documentation and markdown files
          find . -maxdepth 1 -name "*.md" -delete 2>/dev/null || true
          find . -maxdepth 1 -name "*.html" -not -path "./app/static/*" -delete 2>/dev/null || true
          
          # Remove development Python scripts
          rm -f create_*.py export_*.py insert_*.py seed_*.py test_*.py verify_*.py 2>/dev/null || true
          rm -f observability_preview.html start-backend.sh 2>/dev/null || true
          
          # Remove Python cache files (__pycache__ will be excluded by .deploymentignore)
          find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find . -type f -name "*.pyc" -delete 2>/dev/null || true
          find . -type f -name "*.pyo" -delete 2>/dev/null || true
          
          # Remove logs and temporary files
          find . -type f -name "*.log" -delete 2>/dev/null || true
          find . -type f -name "*.tmp" -delete 2>/dev/null || true
          find . -type f -name "*.temp" -delete 2>/dev/null || true
          
          # Remove node_modules if accidentally copied
          rm -rf node_modules/ package*.json 2>/dev/null || true
          
          # Remove .git directories if any
          find . -type d -name ".git" -exec rm -rf {} + 2>/dev/null || true
          
          # Remove large archive files
          find . -name "*.zip" -o -name "*.tar.gz" -o -name "*.tar" -delete 2>/dev/null || true
          
          echo "Package size after cleanup:"
          du -sh . 2>/dev/null | cut -f1 || echo "N/A"
          echo "✓ Cleanup complete"
      
      - name: Verify requirements.txt exists
        run: |
          if [ ! -f "backend/requirements.txt" ]; then
            echo "❌ ERROR: requirements.txt not found in backend directory"
            exit 1
          fi
          echo "✓ requirements.txt found"
          echo "First 20 lines of requirements.txt:"
          head -20 backend/requirements.txt
      
      # Note: App settings moved to AFTER deployment to avoid SCM container restart conflicts
      # The deployment action will use default settings, then we configure after deployment completes
      
      - name: Check package size before deployment
        run: |
          echo "Checking package size..."
          cd backend
          PACKAGE_SIZE=$(du -sh . | cut -f1)
          FILE_COUNT=$(find . -type f | wc -l)
          echo "Package size: $PACKAGE_SIZE"
          echo "File count: $FILE_COUNT"
          echo ""
          echo "Largest directories:"
          du -sh */ 2>/dev/null | sort -hr | head -10
          echo ""
          echo "Checking if static directory exists and size:"
          if [ -d "app/static" ]; then
            STATIC_SIZE=$(du -sh app/static | cut -f1)
            STATIC_FILES=$(find app/static -type f | wc -l)
            echo "  Static directory size: $STATIC_SIZE ($STATIC_FILES files)"
          else
            echo "  ⚠ Static directory not found!"
          fi
      
      - name: Quick SCM check (skip if not critical)
        run: |
          echo "Quick SCM check (non-blocking)..."
          SCM_URL="https://${{ env.AZURE_WEBAPP_NAME }}.scm.azurewebsites.net"
          # Single quick check - don't wait if not ready, deployment will handle it
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 3 $SCM_URL 2>/dev/null || echo "000")
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "401" ] || [ "$HTTP_CODE" = "403" ]; then
            echo "✓ SCM is ready"
          else
            echo "⚠ SCM check skipped - proceeding with deployment (OneDeploy handles this)"
          fi
      
      - name: Check for ongoing deployments
        run: |
          echo "Checking for ongoing deployments before starting..."
          ONGOING=$(az webapp deployment list \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query "[?status=='InProgress'].id" -o tsv 2>/dev/null || echo "")
          
          if [ -n "$ONGOING" ]; then
            echo "⚠ Ongoing deployment detected, waiting 45 seconds..."
            sleep 45
          else
            echo "✓ No ongoing deployments detected"
          fi
        continue-on-error: true
      
      - name: Deploy to Azure Web App (Fast) with Retry
        id: deploy-backend
        run: |
          MAX_RETRIES=3
          RETRY_DELAY=45
          ATTEMPT=1
          DEPLOY_SUCCESS=false
          
          while [ $ATTEMPT -le $MAX_RETRIES ] && [ "$DEPLOY_SUCCESS" = "false" ]; do
            echo ""
            echo "=== Deployment Attempt $ATTEMPT of $MAX_RETRIES ==="
            
            if [ $ATTEMPT -gt 1 ]; then
              echo "Waiting $RETRY_DELAY seconds before retry..."
              sleep $RETRY_DELAY
              
              # Check for ongoing deployments again
              echo "Re-checking for ongoing deployments..."
              ONGOING=$(az webapp deployment list \
                --name ${{ env.AZURE_WEBAPP_NAME }} \
                --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
                --query "[?status=='InProgress'].id" -o tsv 2>/dev/null || echo "")
              
              if [ -n "$ONGOING" ]; then
                echo "⚠ Ongoing deployment still detected, waiting additional 30 seconds..."
                sleep 30
              fi
            fi
            
            # Create zip package
            echo "Creating deployment package..."
            cd backend
            zip -r ../deploy-package.zip . -q
            cd ..
            
            # Attempt deployment using Azure CLI
            echo "Deploying to Azure Web App..."
            DEPLOY_OUTPUT=$(az webapp deploy \
              --name ${{ env.AZURE_WEBAPP_NAME }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --type zip \
              --src-path deploy-package.zip \
              --startup-file "startup.sh" \
              --async false \
              --timeout 900 2>&1) || DEPLOY_EXIT_CODE=$?
            
            if [ -z "${DEPLOY_EXIT_CODE:-}" ] || [ "${DEPLOY_EXIT_CODE:-}" = "0" ]; then
              echo "✓ Deployment successful!"
              DEPLOY_SUCCESS=true
            else
              echo "⚠ Deployment attempt $ATTEMPT failed"
              echo "Error output: $DEPLOY_OUTPUT"
              
              # Check if it's a 409 conflict (retryable)
              if echo "$DEPLOY_OUTPUT" | grep -qi "409\|Conflict\|concurrent\|operation.*in.*progress"; then
                echo "⚠ 409 Conflict detected - this is retryable"
                if [ $ATTEMPT -lt $MAX_RETRIES ]; then
                  echo "Will retry in $RETRY_DELAY seconds..."
                  ATTEMPT=$((ATTEMPT + 1))
                  DEPLOY_EXIT_CODE=""
                else
                  echo "❌ Max retries reached for 409 conflicts"
                  exit 1
                fi
              else
                echo "❌ Non-retryable error detected"
                exit 1
              fi
            fi
          done
          
          if [ "$DEPLOY_SUCCESS" = "false" ]; then
            echo "❌ All deployment attempts failed"
            exit 1
          fi
          
          # Clean up zip file
          rm -f deploy-package.zip
        continue-on-error: false
      
      - name: Wait after deployment (critical for SCM stability)
        run: |
          echo "Waiting 60 seconds after deployment for SCM container to fully stabilize..."
          echo "This prevents SCM restart conflicts when configuring settings"
          sleep 60
          echo "✓ Wait complete - SCM container is stable"
      
      - name: Configure App Settings (After Deployment - No Restart)
        run: |
          echo "Configuring Azure App Service settings AFTER deployment..."
          echo "This approach avoids SCM container restart conflicts"
          
          # Generate JWT secret if not provided
          TEMP_JWT_SECRET="${{ secrets.JWT_SECRET_KEY }}"
          if [ -z "$TEMP_JWT_SECRET" ]; then
            TEMP_JWT_SECRET=$(python3 -c "import secrets; print(secrets.token_urlsafe(32))")
          fi
          
          # Set RAG_API_URL (use secret or default)
          RAG_API_URL_VALUE="${{ secrets.RAG_API_URL }}"
          [ -z "$RAG_API_URL_VALUE" ] && RAG_API_URL_VALUE="https://tbsg.temenos.com"
          
          # Build settings string (combine all settings to minimize API calls)
          SETTINGS_STRING="SCM_DO_BUILD_DURING_DEPLOYMENT=true ENABLE_ORYX_BUILD=true ENVIRONMENT=production DEBUG=False DATABASE_NAME=bsg_demo CORS_ORIGINS=* JWT_SECRET_KEY=$TEMP_JWT_SECRET RAG_API_URL=$RAG_API_URL_VALUE"
          
          # Add secrets if they exist
          [ -n "${{ secrets.DATABASE_URL }}" ] && SETTINGS_STRING="$SETTINGS_STRING DATABASE_URL=${{ secrets.DATABASE_URL }}"
          [ -n "${{ secrets.RAG_JWT_TOKEN }}" ] && SETTINGS_STRING="$SETTINGS_STRING RAG_JWT_TOKEN=${{ secrets.RAG_JWT_TOKEN }}"
          
          # Set all settings in one call (much faster than multiple calls)
          az webapp config appsettings set \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --settings $SETTINGS_STRING \
            --output none
          
          # Set startup and Always On together (single API call)
          az webapp config set \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --startup-file "startup.sh" \
            --always-on true \
            --output none
          
          echo "✓ App settings configured successfully (after deployment with delay)"
      
      - name: Verify deployment completed
        if: steps.deploy-backend.outcome != 'success'
        run: |
          echo "⚠ Deployment step did not complete successfully"
          echo "This may indicate a timeout or deployment failure"
          echo "Check Azure Portal for deployment status"
          exit 1
      
      # NOTE: App settings are configured via the deployment action's app-settings parameter
      # This avoids SCM container restart conflicts by letting Azure handle it during deployment
      
      - name: Quick Health Check (Background - Non-blocking)
        continue-on-error: true
        timeout-minutes: 1
        run: |
          WEBAPP_URL="https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"
          echo "Quick health check (non-blocking, background)..."
          
          # Very short initial wait
          sleep 5
          
          # Single quick check - don't block deployment
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 $WEBAPP_URL/api/v1/live 2>/dev/null || echo "000")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✓ App is responding immediately!"
          else
            echo "⚠ App may still be starting (normal - can take 1-2 minutes)"
            echo "Deployment completed successfully. App will be ready shortly."
            echo "Check status: $WEBAPP_URL/api/v1/live"
          fi
      
      - name: Deployment Summary
        run: |
          WEBAPP_URL="https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"
          echo "## Deployment Complete 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Frontend URL**: $WEBAPP_URL" >> $GITHUB_STEP_SUMMARY
          echo "**Backend API**: $WEBAPP_URL/api/v1" >> $GITHUB_STEP_SUMMARY
          echo "**API Docs**: $WEBAPP_URL/docs" >> $GITHUB_STEP_SUMMARY
          echo "**Health Check**: $WEBAPP_URL/api/v1/health" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🌐 Live Application" >> $GITHUB_STEP_SUMMARY
          echo "Your application is now live at: **$WEBAPP_URL**" >> $GITHUB_STEP_SUMMARY