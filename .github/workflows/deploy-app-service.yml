name: Deploy to Azure App Service

on:
  push:
    branches:
      - develop
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: bsg-demo-platform-app
  AZURE_RESOURCE_GROUP: bsg-demo-platform
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      
      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Test backend imports
        working-directory: ./backend
        run: |
          echo "Testing critical imports..."
          python -c "from app.main import app; print('✓ FastAPI app imports successfully')"
          python -c "from app.core.config import settings; print('✓ Settings import successfully')"
          echo "✓ All critical imports successful"
      
      - name: Validate backend structure
        working-directory: ./backend
        run: |
          echo "Validating backend structure..."
          [ -f "app/main.py" ] || (echo "✗ app/main.py not found" && exit 1)
          [ -f "requirements.txt" ] || (echo "✗ requirements.txt not found" && exit 1)
          [ -d "app/api" ] || (echo "✗ app/api directory not found" && exit 1)
          echo "✓ Backend structure is valid"

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci
      
      - name: Type check frontend
        working-directory: ./frontend
        run: |
          echo "Running TypeScript type check..."
          npx tsc --noEmit || (echo "⚠ TypeScript errors found" && exit 1)
          echo "✓ TypeScript type check passed"
      
      - name: Test frontend build
        working-directory: ./frontend
        run: |
          echo "Testing frontend build..."
          npm run build
          echo "✓ Frontend build successful"
      
      - name: Validate frontend build output
        working-directory: ./frontend
        run: |
          echo "Validating build output..."
          [ -d "dist" ] || (echo "✗ dist directory not found" && exit 1)
          [ -f "dist/index.html" ] || (echo "✗ dist/index.html not found" && exit 1)
          echo "✓ Frontend build output is valid"

  build-and-deploy:
    name: Build and Deploy (Optimized)
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    timeout-minutes: 25
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js and Python (parallel)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      
      - name: Azure Login (early - for parallel operations)
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
        continue-on-error: false
        id: azure-login
      
      - name: Install dependencies and build frontend (consolidated)
        run: |
          echo "Installing dependencies and building in parallel..."
          (
            cd frontend && npm ci && npm run build
          ) &
          FRONTEND_PID=$!
          (
            cd backend && python -m pip install --upgrade pip && pip install -r requirements.txt
          ) &
          BACKEND_PID=$!
          wait $FRONTEND_PID
          wait $BACKEND_PID
          echo "✓ Dependencies installed and frontend built"
        env:
          VITE_API_URL: /api/v1
          NODE_ENV: production
      
      - name: Install kubectl (for AKS namespace discovery) - SKIPPED for speed
        run: |
          echo "⚠ Skipping kubectl installation to speed up deployment"
          echo "kubectl is not needed for deployment - it's only used at runtime for AKS namespace discovery"
          echo "If namespace discovery is needed, kubectl can be installed in Azure App Service separately"
        continue-on-error: true
        id: install-kubectl
      
      - name: Copy frontend build to backend static (Fast)
        run: |
          echo "Copying frontend build to backend static directory..."
          mkdir -p backend/app/static
          if [ -d "frontend/dist" ] && [ "$(ls -A frontend/dist)" ]; then
            # Use rsync if available for faster copy, otherwise cp
            if command -v rsync &> /dev/null; then
              rsync -a --delete frontend/dist/ backend/app/static/
            else
              cp -r frontend/dist/* backend/app/static/
            fi
            # Quick verification only
            [ -f "backend/app/static/index.html" ] || (echo "ERROR: index.html not found!" && exit 1)
            echo "✓ Frontend files copied successfully"
          else
            echo "ERROR: frontend/dist directory is empty or doesn't exist!"
            exit 1
          fi
      
      - name: Make startup script executable
        run: |
          echo "Making startup.sh executable..."
          chmod +x backend/startup.sh
          echo "✓ startup.sh is now executable"
      
      - name: Clean up unnecessary files (fast - parallel)
        working-directory: ./backend
        run: |
          echo "Fast cleanup of unnecessary files..."
          # Run cleanup operations in parallel where possible
          (
            rm -rf scripts/ infrastructure/ uploads/ tests/ .pytest_cache/ .vscode/ .idea/ || true
            find . -maxdepth 1 -name "*.md" -delete 2>/dev/null || true
            find . -maxdepth 1 -name "*.html" -not -path "./app/static/*" -delete 2>/dev/null || true
            rm -f create_*.py export_*.py insert_*.py seed_*.py test_*.py verify_*.py observability_preview.html start-backend.sh 2>/dev/null || true
            find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
            find . -type f \( -name "*.pyc" -o -name "*.pyo" -o -name "*.log" -o -name "*.tmp" -o -name "*.temp" \) -delete 2>/dev/null || true
            rm -rf node_modules/ package*.json 2>/dev/null || true
            find . -type d -name ".git" -exec rm -rf {} + 2>/dev/null || true
            find . \( -name "*.zip" -o -name "*.tar.gz" -o -name "*.tar" \) -delete 2>/dev/null || true
          ) &
          CLEANUP_PID=$!
          wait $CLEANUP_PID
          echo "✓ Cleanup complete"
      
      - name: Verify requirements.txt exists
        run: |
          if [ ! -f "backend/requirements.txt" ]; then
            echo "❌ ERROR: requirements.txt not found in backend directory"
            exit 1
          fi
          echo "✓ requirements.txt found"
          echo "First 20 lines of requirements.txt:"
          head -20 backend/requirements.txt
      
      # Note: App settings moved to AFTER deployment to avoid SCM container restart conflicts
      # The deployment action will use default settings, then we configure after deployment completes
      
      - name: Quick package size check (optional)
        run: |
          echo "Quick package size check..."
          cd backend
          if [ -d "app/static" ]; then
            echo "✓ Static directory exists"
            [ -f "app/static/index.html" ] && echo "✓ index.html found" || echo "⚠ index.html missing"
          else
            echo "⚠ Static directory not found!"
            exit 1
          fi
          cd ..
        continue-on-error: true
        timeout-minutes: 1
      
      - name: Quick SCM check (skip if not critical) - REMOVED for speed
        run: |
          echo "⚠ SCM check removed to speed up deployment"
          echo "OneDeploy will handle SCM readiness automatically"
        continue-on-error: true
        timeout-minutes: 1
      
      - name: Check for ongoing deployments (quick check)
        run: |
          echo "Quick check for ongoing deployments..."
          ONGOING=$(az webapp deployment list \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query "[?status=='InProgress'].id" -o tsv 2>/dev/null || echo "")
          
          if [ -n "$ONGOING" ]; then
            echo "⚠ Ongoing deployment detected, waiting 20 seconds (reduced from 45s)..."
            sleep 20
          else
            echo "✓ No ongoing deployments detected"
          fi
        continue-on-error: true
        timeout-minutes: 1
      
      - name: Create deployment package
        run: |
          echo "Creating deployment package..."
          cd backend
          zip -r ../backend-deploy.zip . -x "*.git*" -x "*__pycache__*" -x "*.pyc" -x "*.pyo" || {
            # Fallback if zip command not available
            echo "Using tar+gzip as fallback..."
            tar -czf ../backend-deploy.tar.gz --exclude='.git' --exclude='__pycache__' --exclude='*.pyc' --exclude='*.pyo' .
            mv ../backend-deploy.tar.gz ../backend-deploy.zip
          }
          cd ..
          echo "Package created: backend-deploy.zip"
          ls -lh backend-deploy.zip || echo "Package file check"
      
      - name: Deploy to Azure Web App (with settings)
        id: deploy-backend
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ./backend-deploy.zip
          startup-command: "bash startup.sh"
        timeout-minutes: 20
        continue-on-error: false
      
      - name: Configure App Settings (minimal wait)
        run: |
          echo "Configuring app settings (minimal wait: 5s)..."
          sleep 5
          
          # Generate JWT secret if not provided
          TEMP_JWT_SECRET="${{ secrets.JWT_SECRET_KEY }}"
          [ -z "$TEMP_JWT_SECRET" ] && TEMP_JWT_SECRET=$(python3 -c "import secrets; print(secrets.token_urlsafe(32))")
          
          # Set RAG_API_URL
          RAG_API_URL_VALUE="${{ secrets.RAG_API_URL }}"
          [ -z "$RAG_API_URL_VALUE" ] && RAG_API_URL_VALUE="https://tbsg.temenos.com"
          
          # Build settings string
          SETTINGS_STRING="SCM_DO_BUILD_DURING_DEPLOYMENT=true ENABLE_ORYX_BUILD=true ENVIRONMENT=production DEBUG=False DATABASE_NAME=bsg_demo CORS_ORIGINS=* JWT_SECRET_KEY=$TEMP_JWT_SECRET RAG_API_URL=$RAG_API_URL_VALUE"
          [ -n "${{ secrets.DATABASE_URL }}" ] && SETTINGS_STRING="$SETTINGS_STRING DATABASE_URL=${{ secrets.DATABASE_URL }}"
          [ -n "${{ secrets.RAG_JWT_TOKEN }}" ] && SETTINGS_STRING="$SETTINGS_STRING RAG_JWT_TOKEN=${{ secrets.RAG_JWT_TOKEN }}"
          
          # Configure in parallel
          az webapp config appsettings set \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --settings $SETTINGS_STRING \
            --output none &
          az webapp config set \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --startup-file "startup.sh" \
            --always-on true \
            --output none &
          wait
          echo "✓ Settings configured"
        timeout-minutes: 2
      
      - name: Verify deployment completed
        if: steps.deploy-backend.outcome != 'success'
        run: |
          echo "⚠ Deployment step did not complete successfully"
          echo "This may indicate a timeout or deployment failure"
          echo "Check Azure Portal for deployment status"
          exit 1
      
      # NOTE: App settings are configured via the deployment action's app-settings parameter
      # This avoids SCM container restart conflicts by letting Azure handle it during deployment
      
      - name: Quick Health Check (Background - Non-blocking)
        continue-on-error: true
        timeout-minutes: 1
        run: |
          WEBAPP_URL="https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"
          echo "Quick health check (non-blocking)..."
          # Single quick check - don't block deployment
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 $WEBAPP_URL/api/v1/live 2>/dev/null || echo "000")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✓ App is responding!"
          else
            echo "⚠ App may still be starting (normal - can take 1-2 minutes)"
            echo "Deployment completed. Check: $WEBAPP_URL/api/v1/live"
          fi
      
      - name: Deployment Summary
        run: |
          WEBAPP_URL="https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"
          echo "## Deployment Complete 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Frontend URL**: $WEBAPP_URL" >> $GITHUB_STEP_SUMMARY
          echo "**Backend API**: $WEBAPP_URL/api/v1" >> $GITHUB_STEP_SUMMARY
          echo "**API Docs**: $WEBAPP_URL/docs" >> $GITHUB_STEP_SUMMARY
          echo "**Health Check**: $WEBAPP_URL/api/v1/health" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🌐 Live Application" >> $GITHUB_STEP_SUMMARY
          echo "Your application is now live at: **$WEBAPP_URL**" >> $GITHUB_STEP_SUMMARY