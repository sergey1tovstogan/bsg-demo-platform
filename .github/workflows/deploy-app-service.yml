name: Deploy to Azure App Service

on:
  push:
    branches:
      - develop
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: bsg-demo-platform-app
  AZURE_RESOURCE_GROUP: bsg-demo-platform
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci
      
      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
        env:
          VITE_API_URL: /api/v1
          NODE_ENV: production
      
      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
        continue-on-error: false
        id: azure-login
      
      - name: Copy frontend build to backend static
        run: |
          mkdir -p backend/app/static
          cp -r frontend/dist/* backend/app/static/
      
      - name: Clean up unnecessary files
        working-directory: ./backend
        run: |
          # Remove files that shouldn't be deployed
          rm -rf scripts/ infrastructure/ uploads/ __pycache__/ .pytest_cache/ || true
          # Find and remove all __pycache__ directories (handle both Unix and Windows paths)
          find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find . -type d -name "*__pycache__*" -exec rm -rf {} + 2>/dev/null || true
          # Remove Python cache files
          find . -type f -name "*.pyc" -delete 2>/dev/null || true
          find . -type f -name "*.pyo" -delete 2>/dev/null || true
          find . -type f -name "*.log" -delete 2>/dev/null || true
          # Remove any Windows-style paths that might have been created
          find . -type f -path "*\\*" -delete 2>/dev/null || true
          find . -type d -path "*\\*" -exec rm -rf {} + 2>/dev/null || true
      
      - name: Create startup script
        run: |
          cat > backend/startup.sh << 'EOF'
          #!/bin/bash
          cd /home/site/wwwroot
          gunicorn app.main:app --bind 0.0.0.0:8000 --workers 4 --worker-class uvicorn.workers.UvicornWorker --timeout 120 --access-logfile - --error-logfile -
          EOF
          chmod +x backend/startup.sh
      
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ./backend
          startup-command: 'gunicorn app.main:app --bind 0.0.0.0:8000 --workers 4 --worker-class uvicorn.workers.UvicornWorker --timeout 120'
      
      - name: Configure App Settings
        run: |
          # Copy app settings JSON to backend directory for deployment
          cp infrastructure/app-settings.json backend/app-settings.json || echo "App settings JSON not found, will set manually"
          
          # Set build settings and environment variables using JSON file
          if [ -f backend/app-settings.json ]; then
            az webapp config appsettings set \
              --name ${{ env.AZURE_WEBAPP_NAME }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --settings @backend/app-settings.json \
              --output none
          else
            # Fallback: set settings manually (for GitHub Actions)
            az webapp config appsettings set \
              --name ${{ env.AZURE_WEBAPP_NAME }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --settings \
                SCM_DO_BUILD_DURING_DEPLOYMENT=false \
                ENABLE_ORYX_BUILD=false \
                ENVIRONMENT=production \
                DEBUG=False \
                DATABASE_NAME=bsg_demo \
              --output none
            echo "Note: DATABASE_URL should be set manually via Azure Portal or using JSON file"
          fi
          
          # Set startup command
          az webapp config set \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --startup-file "gunicorn app.main:app --bind 0.0.0.0:8000 --workers 2 --worker-class uvicorn.workers.UvicornWorker --timeout 120" \
            --output none
          
          # Enable Always On (critical for App Service to prevent sleep)
          az webapp config set \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --always-on true \
            --output none
          
          echo "App settings configured successfully"
      
      - name: Health Check
        run: |
          sleep 30
          WEBAPP_URL="https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"
          curl -f $WEBAPP_URL/api/v1/health || exit 1
          echo "Deployment successful!"
      
      - name: Deployment Summary
        run: |
          WEBAPP_URL="https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"
          echo "## Deployment Complete 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Frontend URL**: $WEBAPP_URL" >> $GITHUB_STEP_SUMMARY
          echo "**Backend API**: $WEBAPP_URL/api/v1" >> $GITHUB_STEP_SUMMARY
          echo "**API Docs**: $WEBAPP_URL/docs" >> $GITHUB_STEP_SUMMARY
          echo "**Health Check**: $WEBAPP_URL/api/v1/health" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🌐 Live Application" >> $GITHUB_STEP_SUMMARY
          echo "Your application is now live at: **$WEBAPP_URL**" >> $GITHUB_STEP_SUMMARY

