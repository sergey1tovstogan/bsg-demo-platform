name: Security Scanning

# Optimized to reduce GitHub Actions usage:
# - Runs on schedule (weekly) instead of every push
# - Runs on PRs to main (important code review)
# - Manual dispatch available for on-demand scans
# - NOT on every push to develop (saves ~648 minutes/month)

on:
  # Weekly scheduled scan (every Monday at 2 AM UTC)
  schedule:
    - cron: '0 2 * * 1'  # Monday 2 AM UTC
  
  # Run on PRs to main (important for code review)
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/**'
  
  # Manual trigger for on-demand scans
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Scan Python dependencies
        working-directory: ./backend
        run: |
          echo "Scanning Python dependencies for vulnerabilities..."
          pip install safety || true
          safety check --file requirements.txt || echo "⚠ Dependency scan completed (some issues may exist)"
        continue-on-error: true
      
      - name: Scan Node.js dependencies
        working-directory: ./frontend
        run: |
          echo "Scanning Node.js dependencies for vulnerabilities..."
          npm audit --audit-level=moderate || echo "⚠ Dependency scan completed (some issues may exist)"
        continue-on-error: true

  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python,javascript
          queries: security-extended,security-and-quality
      
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        continue-on-error: true

  container-scan:
    name: Container Image Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image (for scanning)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: false
          tags: bsg-demo-backend:scan
          load: true
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: bsg-demo-backend:scan
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

  security-summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    needs: [dependency-scan, codeql-analysis, container-scan]
    if: always()
    
    steps:
      - name: Security Scan Summary
        run: |
          echo "## Security Scan Results 🔒" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Dependency Scan" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.dependency-scan.result }}" == "success" ]; then
            echo "✅ Dependency scan completed" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Dependency scan completed with warnings" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### CodeQL Analysis" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.codeql-analysis.result }}" == "success" ]; then
            echo "✅ CodeQL analysis completed" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ CodeQL analysis completed with warnings" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Container Scan" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.container-scan.result }}" == "success" ]; then
            echo "✅ Container scan completed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.container-scan.result }}" == "skipped" ]; then
            echo "⏭️ Container scan skipped (only runs on schedule/manual)" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Container scan completed with warnings" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note**: This workflow runs weekly and on PRs to main to optimize GitHub Actions usage." >> $GITHUB_STEP_SUMMARY
