name: Deploy to Azure Static Web Apps

on:
  push:
    branches:
      - develop
  workflow_dispatch:

env:
  AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
  STATIC_WEB_APP_NAME: bsg-demo-platform-4077
  RESOURCE_GROUP: bsg-demo-platform

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy Frontend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      
      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
        env:
          VITE_API_URL: https://bsg-demo-platform-app.azurewebsites.net/api/v1
          NODE_ENV: production
      
      - name: Copy Static Web App config to dist
        run: |
          if [ -f "frontend/staticwebapp.config.json" ]; then
            cp frontend/staticwebapp.config.json frontend/dist/staticwebapp.config.json
            echo "✓ Copied staticwebapp.config.json to dist"
          else
            echo "⚠ staticwebapp.config.json not found"
          fi
      
      - name: Verify build output
        run: |
          echo "Checking build output..."
          ls -la frontend/dist/ || echo "Build output not found"
          if [ -f "frontend/dist/index.html" ]; then
            echo "✓ index.html found"
          else
            echo "✗ index.html not found - build may have failed"
            exit 1
          fi
          if [ -f "frontend/dist/staticwebapp.config.json" ]; then
            echo "✓ staticwebapp.config.json found in dist"
          fi
      
      - name: Deploy to Azure Static Web Apps
        if: env.AZURE_STATIC_WEB_APPS_API_TOKEN != ''
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/frontend"
          output_location: "dist"
          skip_app_build: true
          skip_deploy_on_missing_secrets: false
      
      - name: Check deployment status
        if: env.AZURE_STATIC_WEB_APPS_API_TOKEN == ''
        run: |
          echo "⚠ Warning: AZURE_STATIC_WEB_APPS_API_TOKEN secret is not set"
          echo "Deployment skipped. To enable deployment:"
          echo "1. Go to Azure Portal → Static Web App → Manage deployment token"
          echo "2. Copy the deployment token"
          echo "3. Add it to GitHub Secrets as AZURE_STATIC_WEB_APPS_API_TOKEN"
      
      - name: Deployment Summary
        run: |
          echo "## Frontend Deployment Complete 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Frontend URL**: https://kind-beach-01c0a990f.3.azurestaticapps.net" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The frontend is now live and accessible!" >> $GITHUB_STEP_SUMMARY

